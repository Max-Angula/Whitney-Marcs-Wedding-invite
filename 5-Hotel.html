<!DOCTYPE html>
<html style="font-size: 16px;" lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <title>5 Hotel</title>

  <!-- Your pack + Nicepage (unchanged) -->
  <link rel="stylesheet" href="css/wm-pack.css">
  <link rel="stylesheet" href="nicepage.css" media="screen">
  <link rel="stylesheet" href="5-Hotel.css" media="screen">
  <script src="jquery.js" defer></script>
  <script src="nicepage.js" defer></script>

  <!-- Fonts -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?display=swap&family=Roboto:wght@100;300;400;500;700;900&family=Open+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900">

  <style>
    /* === Layout base === */
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    header, footer { flex: 0 0 auto; }
    main { flex: 1 0 auto; }

    /* === Hotel cards: SAFE padding (FIXED) === */
    .u-section-1 .u-layout-cell > .u-container-layout {
      padding-top: 24px !important;
      padding-bottom: 32px !important;
    }

    /* Mobile stacking cleanup */
    @media (max-width: 767px) {
      .u-section-1 .u-layout-cell {
        min-height: auto !important;
      }
      .u-section-1 .u-btn {
        margin-bottom: 16px !important;
      }
    }

    /* Remove extra Nicepage spacing ONLY where safe */
    .u-section-1 {
      padding-bottom: 0 !important;
      margin-bottom: 0 !important;
    }
    .u-section-1 .u-sheet-1 {
      min-height: auto !important;
      padding-bottom: 0 !important;
    }
    .u-layout-row {
      margin-bottom: 0 !important;
    }

    /* Remove Nicepage backlink/footer */
    .u-backlink, .u-footer, footer.u-footer {
      display: none !important;
      height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      border: 0 !important;
    }

    /* Footer space reservation */
    :root { --wm-footer-h: 72px; }
    body { padding-bottom: var(--wm-footer-h); }

    /* === Wedding footer bar === */
    .wm-footer--bar{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 9999;
      color: #f8f8f8;
      backdrop-filter: blur(6px) saturate(115%);
      background: linear-gradient(180deg, #607457e0, #607457cc);
      border-top: 1px solid rgba(255,255,255,.2);
      padding: 17px 0;
      font: 12.5px/1.4 system-ui, "Playfair Display", serif;
    }

    .wmf-inner{
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .wmf-center{ text-align: center; }
    .wmf-brand{ font-size: 16px; }
    .wmf-locdate{ font-size: 12px; opacity: .9; }
    .wmf-right{ text-align: right; font-size: 12px; opacity: .8; }

    @media (max-width: 640px){
      .wmf-right{ display: none; }
    }
  </style>
</head>

<body class="u-body u-overlap u-xl-mode">
<header class="u-header">
  <div class="u-sheet">
    <a href="#" class="u-image u-logo">
      <img src="images/ChatGPTImageOct8202503_49_57PM74.png" alt="">
    </a>
  </div>
</header>

<main>
<section class="u-section-1 u-image" id="block-7">
  <div class="u-sheet">
    <div class="u-layout-wrap">
      <div class="u-layout">
        <div class="u-layout-row">

          <!-- Hotel 1 -->
          <div class="u-layout-cell u-size-20 u-image">
            <div class="u-container-layout u-valign-top">
              <a href="https://ateneaportbarcelonamataro.com-hotel.com/es/"
                 class="u-btn u-button-style" target="_blank">
                <img src="images/hotel-ring.gif" alt=""> Atenea Port Barcelona Mataró
              </a>
            </div>
          </div>

          <!-- Hotel 2 -->
          <div class="u-layout-cell u-size-20">
            <div class="u-container-layout u-valign-top">
              <img src="images/ChatGPTImageOct8202503_49_57PM70.png" class="u-image u-image-contain">
              <a href="https://www.hotel-bb.com/es/hotel/barcelona-mataro"
                 class="u-btn u-button-style" target="_blank">
                <img src="images/hotel-ring.gif" alt=""> B&amp;B Hotel Barcelona Mataró
              </a>
            </div>
          </div>

          <!-- Hotel 3 -->
          <div class="u-layout-cell u-size-20 u-image">
            <div class="u-container-layout u-valign-top">
              <a href="https://xanascat.gencat.cat/ca/albergs/albergs/cabrera-de-mar-xanascat"
                 class="u-btn u-button-style" target="_blank">
                <img src="images/hotel-ring.gif" alt="">
                Xanascat, la xarxa jove d'albergs de Catalunya
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
</main>

<footer class="wm-footer--bar">
  <div class="wmf-inner">
    <div></div>
    <div class="wmf-center">
      <span class="wmf-brand">Whitney &amp; Marc</span><br>
      <span class="wmf-locdate">Cabrera de Mar — 19 Jun 2026</span>
    </div>
    <div class="wmf-right" id="wm-time">—</div>
  </div>
</footer>

<script>
(function tick(){
  const el = document.getElementById('wm-time');
  if(!el) return;
  el.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  setTimeout(tick, 1000);
})();
</script>

<script>
(function(){
  const footer = document.querySelector('.wm-footer--bar');
  if(!footer) return;
  const root = document.documentElement;
  function update(){ root.style.setProperty('--wm-footer-h', footer.offsetHeight+'px'); }
  update();
  window.addEventListener('resize', update);
})();
</script>
<script defer src="js/wm-pack.js"></script>
</body>
</html>
